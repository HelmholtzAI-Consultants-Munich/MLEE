<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MLEE Report</title>
  <link rel="icon" href="./resources/img/favicon/favicon.ico" />
  <link rel="stylesheet" href="./resources/bulma/bulma.min.css" />
  <link rel="stylesheet" href="./resources/bulma/bulma-print@1.0.0_css_bulma-print.css">
  <link rel="stylesheet" href="./resources/css/report.css" />
  <script defer src="./resources/fontawesome/all.min.js"></script>
</head>

<body>
  <!-- main report -->
  <section class="section" id="report">
    <div class="container">
      <div class="columns">
        <div class="column">

          <p class="subtitle" id="lala">
          <div class="columns">
            <div class="column">
              <img src="./resources/img/header/logo.png" />
              <h1 class="title">
                MLEE Analysis
              </h1>
            </div>
          </div>

          <!-- TODO -->
          <p>Some intelligent information about this report: <strong><b></b>{{ meta.readable_id }}</b></strong></p>
        </div>
      </div>


      <!-- dataset -->
      <div class="columns">
        <div class="column is-12">
          <h3 class="title is-size-4 title">Dataset</h3>
          <p>Original dimensions: <strong><b></b>{{ dataset.dimension }}</b></strong></p>
          <p>Subset of: <strong><b></b>{{ dataset.subset_percentage }}</b></strong></p>
        </div>
      </div>


      <!-- imputation -->
      <div class="columns">
        <div class="column is-12">
          <h3 class="title is-size-4 title">Imputation</h3>
          <h4 class="title is-size-6 title">train</h4>
          <img src="./session/imputation/train_imputation.png" />

          <P style="page-break-before: always"> </P>
          <!-- TODO consider adding div -->

          <h4 class="title is-size-6 title">test</h4>
          <img src="./session/imputation/test_imputation.png" />
        </div>
      </div>




      made with <span style="color: #5d3ab5;">&hearts;</span> in Bavaria
    </div>
  </section>
</body>

</html>
